<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Mr Clicks</title>
  <link rel="icon" type="image/png" href="assets/images/img40.webp">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  
  <style>
    .admin-container {
      max-width: 800px;
      margin: 100px auto;
      padding: 2rem;
      background: var(--color-light);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .admin-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .admin-form-group {
      margin-bottom: 1.5rem;
    }
    .admin-form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
    }
    .admin-input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }
    .admin-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--color-dark);
      color: var(--color-light);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      transition: background 0.3s;
    }
    .admin-btn:hover {
      background: var(--color-sand-accent);
    }
    .admin-btn.danger {
      background: #e74c3c;
    }
    .admin-btn.danger:hover {
      background: #c0392b;
    }
    
    #dashboard-section {
      display: none;
    }
    
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
    }
    .image-card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .image-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
    .image-card .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(231, 76, 60, 0.9);
      color: white;
      border: none;
      padding: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    
    .status-msg {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 4px;
      display: none;
    }
    .status-msg.success { background: #d4edda; color: #155724; display: block; }
    .status-msg.error { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>

  <!-- Sticky Global Header -->
  <header class="header-bar">
    <a href="index.html" class="brand-logo">
      <img src="assets/images/img40.webp" alt="Mr Clicks Logo">
      <span>Mr Clicks</span>
    </a>
    <nav>
      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="portfolio.html" class="nav-link">Portfolio</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="admin-container">
      
      <!-- Login Section -->
      <div id="login-section">
        <div class="admin-header">
          <h1 class="hero-title" style="font-size: 2.5rem;">Admin Login</h1>
          <p class="script-subheading">Secure Access</p>
        </div>
        
        <div id="login-status" class="status-msg"></div>
        
        <form id="login-form">
          <div class="admin-form-group">
            <label for="admin-email">Email Address</label>
            <input type="email" id="admin-email" class="admin-input" required>
          </div>
          <div class="admin-form-group">
            <label for="admin-password">Password</label>
            <input type="password" id="admin-password" class="admin-input" required>
          </div>
          <button type="submit" class="admin-btn" style="width: 100%;">Login</button>
        </form>
      </div>

      <!-- Dashboard Section -->
      <div id="dashboard-section">
        <div class="admin-header">
          <h1 class="hero-title" style="font-size: 2.5rem;">Admin Dashboard</h1>
          <button id="logout-btn" class="admin-btn" style="margin-top: 1rem;">Logout</button>
        </div>
        
        <div id="upload-status" class="status-msg"></div>

        <div style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
          <h3 style="margin-bottom: 1rem; font-family: 'Cinzel', serif;">Upload New Image</h3>
          
          <form id="upload-form">
            <div class="admin-form-group">
              <label for="image-file">Select Image</label>
              <input type="file" id="image-file" class="admin-input" accept="image/*" required>
            </div>
            
            <div class="admin-form-group">
              <label for="image-category">Category (Portfolio Filter)</label>
              <select id="image-category" class="admin-input" required>
                <option value="weddings">Weddings</option>
                <option value="stories">Stories</option>
                <option value="lifestyle">Lifestyle</option>
                <option value="branding">Personal Branding</option>
              </select>
            </div>
            
            <div class="admin-form-group">
              <label for="image-title">Image Title (Optional)</label>
              <input type="text" id="image-title" class="admin-input" placeholder="e.g. Golden Hour Glow">
            </div>
            
            <button type="submit" class="admin-btn" id="upload-btn">Upload to Cloudinary</button>
          </form>
        </div>
        
        <h3 style="font-family: 'Cinzel', serif; border-bottom: 1px solid #ddd; padding-bottom: 0.5rem;">Manage Uploaded Images</h3>
        <div class="image-grid" id="admin-image-grid">
          <!-- Images will be dynamically loaded here -->
        </div>
      </div>
      
    </div>
  </main>

  <!-- Firebase & App Logic -->
  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
