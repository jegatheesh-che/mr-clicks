<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin App | Mr Clicks</title>
  <link rel="icon" type="image/png" href="/assets/images/img40.webp">
  <link rel="stylesheet" href="/admin/admin.css">
  
  <!-- Feather Icons for sleek app-like UI -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <div class="app-container">
    
    <!-- Login View (Active by Default) -->
    <div id="view-login" class="app-view active">
      <div class="login-wrapper">
        <div class="login-card">
          <h1>Admin Access</h1>
          <form id="login-form">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="admin-email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
              <button type="button" class="toggle-password" id="toggle-password">
                <i data-feather="eye"></i>
              </button>
            </div>
            <button type="submit" class="btn primary" id="login-btn">Secure Login</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Dashboard / Gallery View -->
    <div id="view-dashboard" class="app-view">
      <div class="main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
          <div>
            <h1 class="view-title">Gallery</h1>
            <p class="view-subtitle" id="gallery-count">Manage your portfolio images</p>
          </div>
          <button id="logout-btn" class="btn danger" style="width: auto; padding: 0.5rem 1rem;">
            <i data-feather="log-out" style="width: 16px; height: 16px;"></i>
          </button>
        </div>
        
        <div class="masonry-grid" id="admin-image-grid">
          <!-- Images populated via JS -->
          <p style="color: var(--app-text-muted);">Loading images...</p>
        </div>
      </div>
    </div>

    <!-- Upload View -->
    <div id="view-upload" class="app-view">
      <div class="main-content">
        <h1 class="view-title">Upload</h1>
        <p class="view-subtitle">Add a new image to your portfolio</p>
        
        <div style="background: var(--app-surface); padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);">
          <form id="upload-form">
            <div class="form-group">
              <label>Select Image</label>
              <div style="position: relative; overflow: hidden; background: var(--app-bg); border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2); padding: 2rem; text-align: center; cursor: pointer;" onclick="document.getElementById('image-file').click()">
                <i data-feather="upload-cloud" style="width: 32px; height: 32px; color: var(--app-primary); margin-bottom: 0.5rem;"></i>
                <p style="color: var(--app-text-muted); font-size: 0.85rem;" id="file-name-display">Tap to choose a file</p>
                <input type="file" id="image-file" accept="image/*" required style="display: none;" onchange="document.getElementById('file-name-display').textContent = this.files[0]?.name || 'Tap to choose a file'">
              </div>
            </div>
            
            <div class="form-group">
              <label>Category (Portfolio Filter)</label>
              <select id="image-category" class="form-control" required style="appearance: none;">
                <option value="weddings">Weddings</option>
                <option value="stories">Stories</option>
                <option value="lifestyle">Lifestyle</option>
                <option value="branding">Personal Branding</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Image Title (Optional)</label>
              <input type="text" id="image-title" class="form-control" placeholder="e.g. Golden Hour Glow">
            </div>
            
            <button type="submit" class="btn primary" id="upload-btn" style="margin-top: 1rem;">
              Upload to Cloudinary
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- App Navigation (Hidden on Login) -->
    <nav class="app-nav" id="app-nav" style="display: none;">
      <a class="nav-item active" data-target="view-dashboard">
        <i data-feather="grid"></i>
        <span>Gallery</span>
      </a>
      <a class="nav-item" data-target="view-upload">
        <i data-feather="plus-circle"></i>
        <span>Upload</span>
      </a>
    </nav>
    
  </div>

  <!-- Initialize Feather Icons -->
  <script>
    feather.replace();
    
    // Simple Tab Navigation Logic
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        // Remove active class from all
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
        
        // Add to clicked
        e.currentTarget.classList.add('active');
        const targetId = e.currentTarget.getAttribute('data-target');
        document.getElementById(targetId).classList.add('active');
      });
    });

    // Toggle Password Visibility
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('admin-password');
    
    if (togglePassword && passwordInput) {
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        togglePassword.innerHTML = `<i data-feather="${type === 'password' ? 'eye' : 'eye-off'}"></i>`;
        feather.replace(); // re-render icon
      });
    }
  </script>

  <!-- Firebase & App Logic (Path updated to /assets/) -->
  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
