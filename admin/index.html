<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin | Mr Clicks</title>
  <link rel="icon" type="image/png" href="/assets/images/img40.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
</head>
<body>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <div class="app-shell">

    <!-- ===== LOGIN VIEW ===== -->
    <div id="view-login" class="view active">
      <div class="login-page">
        <div class="login-card">
          <div class="login-logo">
            <img src="/assets/images/img40.webp" alt="Mr Clicks Logo">
          </div>
          <h1>Admin Access</h1>
          <p class="login-sub">Sign in to manage your portfolio</p>

          <div id="login-error" class="alert alert-error" style="display:none;"></div>

          <form id="login-form" novalidate>
            <div class="field-group">
              <label for="admin-email">Email</label>
              <input type="email" id="admin-email" class="field" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="field-group">
              <label for="admin-password">Password</label>
              <div class="field-icon-wrap">
                <input type="password" id="admin-password" class="field" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" id="toggle-password" class="icon-btn" aria-label="Toggle password">
                  <i data-feather="eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" id="login-btn" class="btn btn-primary btn-full">
              Sign In
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- ===== DASHBOARD VIEW ===== -->
    <div id="view-dashboard" class="view">
      <div class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Gallery</h1>
            <p class="page-sub" id="gallery-count">Loading…</p>
          </div>
          <div class="header-actions">
            <button id="select-mode-btn" class="btn btn-ghost">
              <i data-feather="check-square"></i>
              <span>Select</span>
            </button>
            <button id="logout-btn" class="btn btn-ghost icon-only" title="Logout">
              <i data-feather="log-out"></i>
            </button>
          </div>
        </div>

        <div id="admin-image-grid" class="masonry-grid">
          <p class="empty-text">Loading images…</p>
        </div>
      </div>
    </div>

    <!-- ===== UPLOAD VIEW ===== -->
    <div id="view-upload" class="view">
      <div class="page-content">
        <h1 class="page-title">Upload</h1>
        <p class="page-sub">Add new photos to your portfolio</p>

        <form id="upload-form" class="upload-card" novalidate>
          <!-- File Picker -->
          <div class="field-group">
            <label class="drop-zone" id="drop-zone" for="image-file">
              <i data-feather="upload-cloud" class="drop-icon"></i>
              <span id="file-name-display">Tap to select photos</span>
              <small id="file-sub">Supports JPG, PNG, WEBP</small>
              <input type="file" id="image-file" accept="image/*" multiple style="display:none;">
            </label>
          </div>

          <!-- Category -->
          <div class="field-group">
            <label for="image-category">Category</label>
            <div class="select-wrap">
              <select id="image-category" class="field">
                <option value="weddings">Weddings</option>
                <option value="stories">Stories</option>
                <option value="lifestyle">Lifestyle</option>
                <option value="branding">Personal Branding</option>
              </select>
              <i data-feather="chevron-down" class="select-arrow"></i>
            </div>
          </div>

          <!-- Title -->
          <div class="field-group">
            <label for="image-title">Title <span style="opacity:.5;">(optional)</span></label>
            <input type="text" id="image-title" class="field" placeholder="e.g. Golden Hour">
          </div>

          <!-- Progress Bar (hidden until upload) -->
          <div id="upload-progress-wrap" style="display:none;">
            <div class="progress-bar-bg">
              <div id="upload-progress-bar" class="progress-bar-fill"></div>
            </div>
            <p id="upload-progress-text" class="progress-text">Uploading 0 of 0…</p>
          </div>

          <button type="submit" id="upload-btn" class="btn btn-primary btn-full" style="margin-top:1.5rem;">
            <i data-feather="upload"></i>
            Upload to Portfolio
          </button>
        </form>
      </div>
    </div>

    <!-- ===== NAV (hidden until logged in) ===== -->
    <nav id="app-nav" class="app-nav" style="display:none;">
      <button class="nav-item active" data-target="view-dashboard">
        <i data-feather="grid"></i>
        <span>Gallery</span>
      </button>
      <button class="nav-item" data-target="view-upload">
        <i data-feather="plus-circle"></i>
        <span>Upload</span>
      </button>
    </nav>

  </div><!-- /.app-shell -->

  <!-- Bulk Delete Bar -->
  <div id="bulk-bar" class="bulk-bar">
    <span id="bulk-count-text">0 selected</span>
    <button id="bulk-delete-btn" class="btn btn-danger">
      <i data-feather="trash-2"></i>
      Delete
    </button>
  </div>

  <script>
    // Init feather icons
    feather.replace({ 'stroke-width': 2 });

    // --- Tab Navigation ---
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        item.classList.add('active');
        document.getElementById(item.getAttribute('data-target')).classList.add('active');
      });
    });

    // --- Toggle Password ---
    const toggleBtn = document.getElementById('toggle-password');
    const pwInput   = document.getElementById('admin-password');
    if (toggleBtn && pwInput) {
      toggleBtn.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        toggleBtn.innerHTML = show
          ? '<i data-feather="eye-off"></i>'
          : '<i data-feather="eye"></i>';
        feather.replace({ 'stroke-width': 2 });
      });
    }

    // --- File input display ---
    document.getElementById('image-file').addEventListener('change', function () {
      const n = this.files.length;
      document.getElementById('file-name-display').textContent =
        n > 1 ? `${n} photos selected` : (this.files[0]?.name || 'Tap to select photos');
      document.getElementById('file-sub').textContent =
        n > 1 ? `${n} files ready to upload` : 'Supports JPG, PNG, WEBP';
    });

    // --- Drag & drop support ---
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const fileInput = document.getElementById('image-file');
      fileInput.files = e.dataTransfer.files;
      fileInput.dispatchEvent(new Event('change'));
    });
  </script>

  <!-- Firebase module -->
  <script type="module" src="/assets/js/admin.js"></script>

</body>
</html>
